name: vulcan
channels:
  - conda-forge
  - defaults

dependencies:
  # ---- Core ----
  - python=3.11
  - pip

  # ---- Scientific stack (conda) ----
  - numpy
  - scipy
  - pandas
  - pyarrow
  - duckdb
  - tqdm

  # ---- FAISS (GPU via conda) ----
  - faiss-gpu

  # ---- HF ecosystem (conda) ----
  - transformers
  - datasets
  - wandb

  # ---- pip-only / fast-moving ----
  - pip:
      # PyTorch CUDA 13.0 wheels
      - torch
      - torchvision
      - --index-url https://download.pytorch.org/whl/cu130

      # HuggingFace
      - huggingface-hub
      - accelerate>=0.26.0
