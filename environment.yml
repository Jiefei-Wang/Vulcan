name: vulcan
channels:
  - conda-forge
  - defaults

dependencies:
  # ---- Core ----
  - python=3.11
  - pip

  # ---- Scientific stack (conda) ----
  - numpy
  - scipy
  - pandas
  - pyarrow
  - duckdb
  - tqdm
  - scikit-learn

  # ---- HF ecosystem (conda) ----
  - transformers
  - datasets
  - wandb

  # ---- pip-only / fast-moving ----
  - pip:
      # HuggingFace
      - huggingface-hub
      - accelerate>=0.26.0
      - sentence_transformers

# Additional libraries:
# pip3 install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# conda install pytorch::faiss-gpu